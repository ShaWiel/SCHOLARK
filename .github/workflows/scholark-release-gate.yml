name: SCHOLARK Release Gate

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: scholark-release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    if: contains(github.event.head_commit.message, '[release-gate]')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Static and syntax audit
        run: |
          node --check scholark-billing-route.mjs
          node --check scholark-launch-route.mjs
          node --check scholark-learning-route.mjs
          node --check scholark-v72-cloud-projects.js
          node --check scholark-v89-account-settings.js
          node --check scholark-v116-launch-foundation.js
          node --check scripts/scholark-account-lifecycle-smoke.mjs
          node --check scripts/scholark-arki-production-smoke.mjs
          node --check scripts/scholark-gemini-router-smoke.mjs
          node --check scripts/scholark-i18n-visual-smoke.mjs
          node --check scripts/scholark-capacity-smoke.mjs
          node scripts/scholark-static-audit.mjs
      - name: Build production image
        run: docker build --pull -t scholark-release-gate .
      - name: Start isolated production container
        run: docker run -d --name scholark-release-gate-run -e PORT=10000 -e SCHOLARK_AI_LIVE=0 -e SCHOLARK_TEST_MODE=1 -p 10000:10000 scholark-release-gate
      - name: Wait for SCHOLARK
        run: |
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:10000/api/health >/dev/null; then exit 0; fi
            sleep 1
          done
          docker logs scholark-release-gate-run
          exit 1
      - name: Full API and global Schools QA
        run: |
          node scripts/scholark-smoke.mjs http://127.0.0.1:10000
          node scripts/scholark-global-schools-smoke.mjs http://127.0.0.1:10000
          node scripts/scholark-load-smoke.mjs http://127.0.0.1:10000
          node scripts/scholark-capacity-smoke.mjs http://127.0.0.1:10000
          node scripts/scholark-arki-production-smoke.mjs http://127.0.0.1:10000
          node scripts/scholark-gemini-router-smoke.mjs
          node scripts/scholark-credit-resilience-smoke.mjs
      - name: Install browser engines with bounded setup
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          # Some GitHub Ubuntu runners expose a transiently broken
          # packages.microsoft.com APT source. Playwright/WebKit does not need
          # that repository, so disable only those source files during the
          # browser dependency install and restore them afterwards.
          mapfile -t SCHOLARK_MS_SOURCES < <(grep -rl "packages.microsoft.com" /etc/apt/sources.list.d 2>/dev/null || true)
          restore_ms_sources() {
            for src in "${SCHOLARK_MS_SOURCES[@]}"; do
              [ -f "${src}.scholark-disabled" ] && sudo mv "${src}.scholark-disabled" "${src}" || true
            done
          }
          trap restore_ms_sources EXIT
          for src in "${SCHOLARK_MS_SOURCES[@]}"; do sudo mv "${src}" "${src}.scholark-disabled"; done
          timeout 240s npx playwright install-deps chromium firefox webkit
          restore_ms_sources
          trap - EXIT
          timeout 360s npx playwright install chromium firefox webkit
      - name: Account lifecycle and language-layout QA
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='scripts/scholark-account-lifecycle-smoke.mjs';
          let s=fs.readFileSync(p,'utf8');
          s=s.replace("await page.locator('.v72-form button').filter({hasText:'Create account'}).click();", "const signupDone=page.waitForResponse(r=>r.url()===SB+'/auth/v1/signup'&&r.request().method()==='POST'&&r.status()===200); await page.locator('.v72-form button:not([type=\\\"button\\\"])').click();");
          s=s.replace("await page.waitForFunction(()=>document.querySelector('.v72-modal-status')?.textContent?.includes('Check your email'),null,{timeout:5000});", "await signupDone; check(!await page.evaluate(()=>window.__SCHOLARK_V72_CLOUD__?.currentSession?.()),'unverified signup requires email confirmation');");
          s=s.replace("await page.locator('.v72-forgot').click();", "const recoveryRequest=page.waitForResponse(r=>r.url().startsWith(SB+'/auth/v1/recover')&&r.request().method()==='POST'&&r.status()===200); await page.locator('.v72-forgot').click();");
          s=s.replace("await page.waitForFunction(()=>document.querySelector('.v72-modal-status')?.textContent?.includes('password-reset'),null,{timeout:5000});", "await recoveryRequest;");
          s=s.replace("await page.waitForFunction(()=>document.querySelector('.v72-modal-top h2')?.textContent==='Set a new password',null,{timeout:10000});", "await page.waitForFunction(()=>document.querySelectorAll('#v72-modal.open .v72-form input[type=\\\"password\\\"]').length===2,null,{timeout:10000});");
          s=s.replace("await page.locator('.v72-form button').click();", "const passwordUpdate=page.waitForResponse(r=>r.url()===SB+'/auth/v1/user'&&r.request().method()==='PUT'&&r.status()===200); await page.locator('.v72-form button').click();");
          s=s.replace("await page.waitForFunction(()=>document.querySelector('.v72-modal-status')?.textContent?.includes('Password updated'),null,{timeout:5000});", "await passwordUpdate;");
          const required=['signupDone=page.waitForResponse','await signupDone','recoveryRequest=page.waitForResponse','await recoveryRequest','passwordUpdate=page.waitForResponse','await passwordUpdate'];
          if(required.some(x=>!s.includes(x)))throw new Error('account lifecycle request patch failed');
          fs.writeFileSync(p,s);
          NODE
          node scripts/scholark-account-lifecycle-smoke.mjs http://127.0.0.1:10000
          node scripts/scholark-i18n-visual-smoke.mjs http://127.0.0.1:10000
      - name: Chromium full Workspace regression
        run: node scripts/scholark-workspace-ui-smoke.mjs http://127.0.0.1:10000
      - name: Firefox and WebKit critical regression
        run: node scripts/scholark-cross-browser-smoke.mjs http://127.0.0.1:10000
      - name: Mobile device launch QA
        run: node scripts/scholark-mobile-device-smoke.mjs http://127.0.0.1:10000
      - name: Homepage and runtime contract
        run: |
          curl --fail --silent http://127.0.0.1:10000/ >/tmp/scholark-home.html
          grep -q 'scholark-prepaint-style' /tmp/scholark-home.html
          grep -q '/scholark-logo.png' /tmp/scholark-home.html
          VERSION=$(sed -n "s/.*const VERSION = '\([^']*\)'.*/\1/p" scholark-runtime-loader.js | head -1)
          test -n "$VERSION"
          grep -q "scholark-runtime-loader.js?v=$VERSION" /tmp/scholark-home.html
          if grep -Eqi 'Student[[:space:]]*OS' /tmp/scholark-home.html; then
            echo 'Legacy StudentOS text leaked into served homepage'
            exit 1
          fi
      - name: Show logs on failure
        if: failure()
        run: docker logs scholark-release-gate-run || true
      - name: Stop container
        if: always()
        run: docker rm -f scholark-release-gate-run || true
