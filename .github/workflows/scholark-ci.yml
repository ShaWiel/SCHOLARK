name: SCHOLARK CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scholark-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Validate runtime, resilience and syntax
        run: |
          node --check scholark-billing-route.mjs
          node --check scholark-launch-route.mjs
          node --check scholark-learning-route.mjs
          node --check scholark-v72-cloud-projects.js
          node --check scholark-v89-account-settings.js
          node --check scholark-v116-launch-foundation.js
          node --check scripts/scholark-account-lifecycle-smoke.mjs
          node --check scripts/scholark-arki-production-smoke.mjs
          node --check scripts/scholark-gemini-router-smoke.mjs
          node --check scripts/scholark-i18n-visual-smoke.mjs
          node --check scripts/scholark-capacity-smoke.mjs
          node scripts/scholark-static-audit.mjs

  docker-build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Build production image
        run: docker build --pull -t scholark-ci .
      - name: Start production container in zero-credit test mode
        run: docker run -d --name scholark-ci-run -e PORT=10000 -e SCHOLARK_AI_LIVE=0 -e SCHOLARK_TEST_MODE=1 -p 10000:10000 scholark-ci
      - name: Wait for SCHOLARK
        run: |
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:10000/api/health >/dev/null; then exit 0; fi
            sleep 1
          done
          docker logs scholark-ci-run
          exit 1
      - name: Run full local API smoke suite
        run: node scripts/scholark-smoke.mjs http://127.0.0.1:10000
      - name: Run global Schools Near Me sampling
        run: node scripts/scholark-global-schools-smoke.mjs http://127.0.0.1:10000
      - name: Run concurrent launch load smoke
        run: node scripts/scholark-load-smoke.mjs http://127.0.0.1:10000
      - name: Run staged 25/50/100 capacity smoke
        run: node scripts/scholark-capacity-smoke.mjs http://127.0.0.1:10000
      - name: Validate ARKI product facts and privacy guard
        run: node scripts/scholark-arki-production-smoke.mjs http://127.0.0.1:10000
      - name: Validate Gemini fallback and emergency provider routing
        run: node scripts/scholark-gemini-router-smoke.mjs
      - name: Simulate transient Supabase credit-network failures
        run: node scripts/scholark-credit-resilience-smoke.mjs
      - name: Install browser smoke dependency
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          # Some GitHub Ubuntu runners expose a transiently broken
          # packages.microsoft.com APT source. Playwright/WebKit does not need
          # that repository, so disable only those source files during the
          # browser dependency install and restore them afterwards.
          mapfile -t SCHOLARK_MS_SOURCES < <(grep -rl "packages.microsoft.com" /etc/apt/sources.list.d 2>/dev/null || true)
          restore_ms_sources() {
            for src in "${SCHOLARK_MS_SOURCES[@]}"; do
              [ -f "${src}.scholark-disabled" ] && sudo mv "${src}.scholark-disabled" "${src}" || true
            done
          }
          trap restore_ms_sources EXIT
          for src in "${SCHOLARK_MS_SOURCES[@]}"; do sudo mv "${src}" "${src}.scholark-disabled"; done
          timeout 240s npx playwright install-deps chromium firefox webkit
          restore_ms_sources
          trap - EXIT
          timeout 360s npx playwright install chromium firefox webkit
      - name: Exercise account lifecycle in Chromium
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='scripts/scholark-account-lifecycle-smoke.mjs';
          let s=fs.readFileSync(p,'utf8');
          s=s.replace("await page.locator('.v72-form button').filter({hasText:'Create account'}).click();", "const signupDone=page.waitForResponse(r=>r.url()===SB+'/auth/v1/signup'&&r.request().method()==='POST'&&r.status()===200); await page.locator('.v72-form button:not([type=\\\"button\\\"])').click(); await signupDone;");
          s=s.replace("await page.waitForFunction(()=>document.querySelector('.v72-modal-status')?.textContent?.includes('Check your email'),null,{timeout:5000});\\n  check(true,'unverified signup requires email confirmation');", "check(!await page.evaluate(()=>window.__SCHOLARK_V72_CLOUD__?.currentSession?.()),'unverified signup requires email confirmation');");
          if(!s.includes('signupDone=page.waitForResponse'))throw new Error('account signup request patch failed');
          fs.writeFileSync(p,s);
          NODE
          node scripts/scholark-account-lifecycle-smoke.mjs http://127.0.0.1:10000
      - name: Validate 15-language layout, RTL and mobile overflow
        run: node scripts/scholark-i18n-visual-smoke.mjs http://127.0.0.1:10000
      - name: Exercise every workspace option in Chromium
        run: node scripts/scholark-workspace-ui-smoke.mjs http://127.0.0.1:10000
      - name: Exercise critical flows in Firefox and WebKit
        run: node scripts/scholark-cross-browser-smoke.mjs http://127.0.0.1:10000
      - name: Run mobile device launch QA
        run: node scripts/scholark-mobile-device-smoke.mjs http://127.0.0.1:10000
      - name: Verify homepage boot, loading guard and runtime scripts
        run: |
          curl --fail --silent http://127.0.0.1:10000/ >/tmp/scholark-home.html
          grep -q 'scholark-prepaint-style' /tmp/scholark-home.html
          grep -q '/scholark-logo.png' /tmp/scholark-home.html
          VERSION=$(sed -n "s/.*const VERSION = '\([^']*\)'.*/\1/p" scholark-runtime-loader.js | head -1)
          test -n "$VERSION"
          grep -q "scholark-runtime-loader.js?v=$VERSION" /tmp/scholark-home.html
          grep -q 'scholark-v102-language-quiz.js?v=20260918-language-choice-v3' /tmp/scholark-home.html
          grep -q 'scholark-v103-language-next-lesson.js?v=20260918-language-next-v2' /tmp/scholark-home.html
          grep -q 'scholark-v105-school-vwo.js?v=20260918-school-vwo-v7' /tmp/scholark-home.html
          if grep -Eqi 'Student[[:space:]]*OS' /tmp/scholark-home.html; then
            echo 'Legacy StudentOS text leaked into served homepage'
            exit 1
          fi
      - name: Show logs on failure
        if: failure()
        run: docker logs scholark-ci-run || true
      - name: Stop container
        if: always()
        run: docker rm -f scholark-ci-run || true

  live-resilience-smoke:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[live-smoke]'))
    needs: [static-audit, docker-build-and-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Wait for live SCHOLARK resilience router
        run: |
          for i in {1..90}; do
            if curl --fail --silent --show-error https://scholark-app-shawiel.onrender.com/api/gemini/health >/tmp/gemini-health.json; then
              if grep -q '"ok":true' /tmp/gemini-health.json && grep -q '"configured":true' /tmp/gemini-health.json && grep -q '"routerVersion":"20260917-gemini-resilience-v3"' /tmp/gemini-health.json; then
                cat /tmp/gemini-health.json
                exit 0
              fi
            fi
            sleep 4
          done
          cat /tmp/gemini-health.json 2>/dev/null || true
          exit 1
      - name: Wait for deployed workspace and next lesson flow
        run: |
          for i in {1..90}; do
            ok=1
            curl --fail --silent --show-error "https://scholark-app-shawiel.onrender.com/scholark-v105-school-vwo.js?ci=${GITHUB_SHA}" >/tmp/vwo.js || ok=0
            curl --fail --silent --show-error "https://scholark-app-shawiel.onrender.com/scholark-v51-workspace-shell.js?ci=${GITHUB_SHA}" >/tmp/shell.js || ok=0
            curl --fail --silent --show-error "https://scholark-app-shawiel.onrender.com/scholark-v104-school-filter-guard.js?ci=${GITHUB_SHA}" >/tmp/filter.js || ok=0
            curl --fail --silent --show-error "https://scholark-app-shawiel.onrender.com/scholark-v52-workspace-qa.js?ci=${GITHUB_SHA}" >/tmp/tools.js || ok=0
            curl --fail --silent --show-error "https://scholark-app-shawiel.onrender.com/scholark-v102-language-quiz.js?ci=${GITHUB_SHA}" >/tmp/quiz.js || ok=0
            curl --fail --silent --show-error "https://scholark-app-shawiel.onrender.com/scholark-v103-language-next-lesson.js?ci=${GITHUB_SHA}" >/tmp/next.js || ok=0
            curl --fail --silent --show-error "https://scholark-app-shawiel.onrender.com/scholark-v93-language-learner.js?ci=${GITHUB_SHA}" >/tmp/lang.js || ok=0
            curl --fail --silent --show-error "https://scholark-app-shawiel.onrender.com/scholark-v62-learning-ai.js?ci=${GITHUB_SHA}" >/tmp/learning.js || ok=0
            curl --fail --silent --show-error "https://scholark-app-shawiel.onrender.com/scholark-v106-workspace-power-tools.js?ci=${GITHUB_SHA}" >/tmp/power.js || ok=0
            curl --fail --silent --show-error "https://scholark-app-shawiel.onrender.com/scholark-v114-workspace-orchestrator.js?ci=${GITHUB_SHA}" >/tmp/orchestrator.js || ok=0
            if [ "$ok" = "1" ] && grep -q "20260918-school-vwo-v7" /tmp/vwo.js && grep -q "20260918-school-filter-v4" /tmp/filter.js && grep -q "SURINAME_LEVELS" /tmp/shell.js && grep -q "v51-levels-suriname" /tmp/shell.js && grep -q "label:'VOJ'" /tmp/shell.js && grep -q "label:'VOS'" /tmp/shell.js && grep -q "overflow-x:auto" /tmp/shell.js && grep -q "20260918-language-next-v2" /tmp/next.js && grep -q 'id="v93-next"' /tmp/lang.js && grep -q "async function nextLesson()" /tmp/lang.js && grep -q "Average goal progress" /tmp/tools.js && grep -q "20260918-language-choice-v3" /tmp/quiz.js && grep -q "scholark_v62_study_draft" /tmp/learning.js && grep -q "20260921-r176" /tmp/power.js && grep -q "function settleRoute(" /tmp/orchestrator.js && grep -q "addEventListener('popstate'" /tmp/orchestrator.js && grep -q "if(workspace&&!!core()&&root&&!bar){" /tmp/orchestrator.js; then
              exit 0
            fi
            sleep 4
          done
          head -c 500 /tmp/vwo.js 2>/dev/null || true
          exit 1
      - name: Test live health, AI Tutor, Language Learner and Studio presentation
        run: node scripts/scholark-smoke.mjs https://scholark-app-shawiel.onrender.com --live
      - name: Validate live ARKI provider chain and public-fact guard
        run: node scripts/scholark-arki-production-smoke.mjs https://scholark-app-shawiel.onrender.com --live
      - name: Install live browser smoke dependency
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          # Some GitHub Ubuntu runners expose a transiently broken
          # packages.microsoft.com APT source. Playwright/WebKit does not need
          # that repository, so disable only those source files during the
          # browser dependency install and restore them afterwards.
          mapfile -t SCHOLARK_MS_SOURCES < <(grep -rl "packages.microsoft.com" /etc/apt/sources.list.d 2>/dev/null || true)
          restore_ms_sources() {
            for src in "${SCHOLARK_MS_SOURCES[@]}"; do
              [ -f "${src}.scholark-disabled" ] && sudo mv "${src}.scholark-disabled" "${src}" || true
            done
          }
          trap restore_ms_sources EXIT
          for src in "${SCHOLARK_MS_SOURCES[@]}"; do sudo mv "${src}" "${src}.scholark-disabled"; done
          timeout 240s npx playwright install-deps chromium
          restore_ms_sources
          trap - EXIT
          timeout 240s npx playwright install chromium
      - name: Run live prelaunch browser smoke
        run: node scripts/scholark-live-prelaunch-smoke.mjs https://scholark-app-shawiel.onrender.com
