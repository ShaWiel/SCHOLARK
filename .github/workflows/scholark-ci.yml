name: SCHOLARK CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate runtime, resilience and syntax
        run: node scripts/scholark-static-audit.mjs

  docker-build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build production image
        run: docker build --pull -t scholark-ci .
      - name: Start production container in zero-credit test mode
        run: docker run -d --name scholark-ci-run -e PORT=10000 -e SCHOLARK_AI_LIVE=0 -e SCHOLARK_TEST_MODE=1 -p 10000:10000 scholark-ci
      - name: Wait for SCHOLARK
        run: |
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:10000/api/health >/dev/null; then exit 0; fi
            sleep 1
          done
          docker logs scholark-ci-run
          exit 1
      - name: Run full local API smoke suite
        run: node scripts/scholark-smoke.mjs http://127.0.0.1:10000
      - name: Verify homepage boot, loading guard and runtime scripts
        run: |
          curl --fail --silent http://127.0.0.1:10000/ >/tmp/scholark-home.html
          grep -q 'scholark-prepaint-style' /tmp/scholark-home.html
          grep -q '/scholark-logo.png' /tmp/scholark-home.html
          grep -q 'scholark-runtime-loader.js?v=20260918-r144' /tmp/scholark-home.html
          grep -q 'scholark-v102-language-quiz.js?v=20260918-language-choice-v3' /tmp/scholark-home.html
          grep -q 'scholark-v103-language-next-lesson.js?v=20260918-language-next-v2' /tmp/scholark-home.html
          grep -q 'scholark-v105-school-vwo.js?v=20260918-school-vwo-v7' /tmp/scholark-home.html
          if grep -Eqi 'Student[[:space:]]*OS' /tmp/scholark-home.html; then
            echo 'Legacy StudentOS text leaked into served homepage'
            exit 1
          fi
      - name: Show logs on failure
        if: failure()
        run: docker logs scholark-ci-run || true
      - name: Stop container
        if: always()
        run: docker rm -f scholark-ci-run || true

  live-resilience-smoke:
    if: github.event_name == 'push'
    needs: [static-audit, docker-build-and-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait for live SCHOLARK resilience router
        run: |
          for i in {1..90}; do
            if curl --fail --silent --show-error https://scholark-app-shawiel.onrender.com/api/gemini/health >/tmp/gemini-health.json; then
              if grep -q '"ok":true' /tmp/gemini-health.json && grep -q '"configured":true' /tmp/gemini-health.json && grep -q '"routerVersion":"20260917-gemini-resilience-v3"' /tmp/gemini-health.json; then
                cat /tmp/gemini-health.json
                exit 0
              fi
            fi
            sleep 4
          done
          cat /tmp/gemini-health.json 2>/dev/null || true
          exit 1
      - name: Wait for deployed R144 dashboard and next lesson flow
        run: |
          for i in {1..90}; do
            ok=1
            curl --fail --silent --show-error "https://scholark-app-shawiel.onrender.com/scholark-v105-school-vwo.js?ci=${GITHUB_SHA}" >/tmp/vwo.js || ok=0
            curl --fail --silent --show-error "https://scholark-app-shawiel.onrender.com/scholark-v51-workspace-shell.js?ci=${GITHUB_SHA}" >/tmp/shell.js || ok=0
            curl --fail --silent --show-error "https://scholark-app-shawiel.onrender.com/scholark-v104-school-filter-guard.js?ci=${GITHUB_SHA}" >/tmp/filter.js || ok=0
            curl --fail --silent --show-error "https://scholark-app-shawiel.onrender.com/scholark-v52-workspace-qa.js?ci=${GITHUB_SHA}" >/tmp/tools.js || ok=0
            curl --fail --silent --show-error "https://scholark-app-shawiel.onrender.com/scholark-v102-language-quiz.js?ci=${GITHUB_SHA}" >/tmp/quiz.js || ok=0
            curl --fail --silent --show-error "https://scholark-app-shawiel.onrender.com/scholark-v103-language-next-lesson.js?ci=${GITHUB_SHA}" >/tmp/next.js || ok=0
            curl --fail --silent --show-error "https://scholark-app-shawiel.onrender.com/scholark-v93-language-learner.js?ci=${GITHUB_SHA}" >/tmp/lang.js || ok=0
            curl --fail --silent --show-error "https://scholark-app-shawiel.onrender.com/scholark-v62-learning-ai.js?ci=${GITHUB_SHA}" >/tmp/learning.js || ok=0
            curl --fail --silent --show-error "https://scholark-app-shawiel.onrender.com/scholark-v106-workspace-power-tools.js?ci=${GITHUB_SHA}" >/tmp/power.js || ok=0
            if [ "$ok" = "1" ] && grep -q "20260918-school-vwo-v7" /tmp/vwo.js && grep -q "20260918-school-filter-v4" /tmp/filter.js && grep -q "SURINAME_LEVELS" /tmp/shell.js && grep -q "v51-levels-suriname" /tmp/shell.js && grep -q "label:'VOJ'" /tmp/shell.js && grep -q "label:'VOS'" /tmp/shell.js && grep -q "overflow-x:auto" /tmp/shell.js && grep -q "20260918-language-next-v2" /tmp/next.js && grep -q 'id="v93-next"' /tmp/lang.js && grep -q "async function nextLesson()" /tmp/lang.js && grep -q "Average goal progress" /tmp/tools.js && grep -q "20260918-language-choice-v3" /tmp/quiz.js && grep -q "scholark_v62_study_draft" /tmp/learning.js && grep -q "20260918-workspace-power-v2" /tmp/power.js; then
              exit 0
            fi
            sleep 4
          done
          head -c 500 /tmp/vwo.js 2>/dev/null || true
          exit 1
      - name: Test live health, AI Tutor, Language Learner and Studio presentation
        run: node scripts/scholark-smoke.mjs https://scholark-app-shawiel.onrender.com --live
