name: SCHOLARK CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate runtime, release and syntax
        run: node scripts/scholark-static-audit.mjs

  docker-build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --pull -t scholark-ci .
      - name: Start production container
        run: docker run -d --name scholark-ci-run -e PORT=10000 -p 10000:10000 scholark-ci
      - name: Wait for SCHOLARK
        run: |
          for i in {1..45}; do
            if curl --fail --silent http://127.0.0.1:10000/api/health >/dev/null; then exit 0; fi
            sleep 1
          done
          docker logs scholark-ci-run
          exit 1
      - name: Smoke test critical surfaces
        run: |
          curl --fail --silent http://127.0.0.1:10000/api/health | grep -q '"ok":true'
          curl --fail --silent http://127.0.0.1:10000/api/guard/health | grep -q '"ok":true'
          curl --fail --silent http://127.0.0.1:10000/api/studio/health | grep -q '"ok":true'
          curl --fail --silent http://127.0.0.1:10000/api/learning/health | grep -q '"ok":true'
          curl --fail --silent http://127.0.0.1:10000/api/gemini/health >/tmp/scholark-gemini.json
          grep -q '"provider":"gemini"' /tmp/scholark-gemini.json
          grep -q '"model":"gemini-3.8-flash"' /tmp/scholark-gemini.json
          grep -q '"liveEnabled":true' /tmp/scholark-gemini.json
          curl --fail --silent http://127.0.0.1:10000/ >/tmp/scholark-home.html
          grep -q 'scholark-runtime-loader.js?v=20260910-r136' /tmp/scholark-home.html
      - name: Show logs on failure
        if: failure()
        run: docker logs scholark-ci-run || true
      - name: Stop container
        if: always()
        run: docker rm -f scholark-ci-run || true

  live-gemini-smoke:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for live SCHOLARK Gemini health
        run: |
          for i in {1..60}; do
            if curl --fail --silent --show-error https://scholark-app-shawiel.onrender.com/api/gemini/health >/tmp/gemini-health.json; then
              if grep -q '"ok":true' /tmp/gemini-health.json && grep -q '"configured":true' /tmp/gemini-health.json && grep -q '"model":"gemini-3.8-flash"' /tmp/gemini-health.json; then
                cat /tmp/gemini-health.json
                exit 0
              fi
            fi
            sleep 3
          done
          cat /tmp/gemini-health.json 2>/dev/null || true
          exit 1
      - name: Verify AI Tutor uses Gemini
        run: |
          curl --fail --silent --show-error \
            -H 'content-type: application/json' \
            --data '{"mode":"tutor","prompt":"Explain photosynthesis in one concise sentence.","level":"student","language":"English"}' \
            https://scholark-app-shawiel.onrender.com/api/learning/generate >/tmp/gemini-learning.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/gemini-learning.json'))
          assert d.get('ok') is True, d
          assert d.get('provider') == 'gemini', d
          assert d.get('model') == 'gemini-3.8-flash', d
          print('AI Tutor live Gemini PASS')
          PY
      - name: Verify Studio AI uses Gemini
        run: |
          curl --fail --silent --show-error \
            -H 'content-type: application/json' \
            --data '{"mode":"graphic","prompt":"Create a concise study reminder about staying hydrated.","count":1,"language":"English"}' \
            https://scholark-app-shawiel.onrender.com/api/studio/generate >/tmp/gemini-studio.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/gemini-studio.json'))
          assert d.get('ok') is True, d
          assert d.get('provider') == 'gemini', d
          assert d.get('model') == 'gemini-3.8-flash', d
          assert isinstance(d.get('artifact',{}).get('sections'), list) and d['artifact']['sections'], d
          print('Studio AI live Gemini PASS')
          PY
